<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>語界解構者：試煉之塔 Tower of Trials</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Rajdhani:wght@600;700&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --void: #0A0817; --mist: #17133A; --mist-2: #201A4A;
    --cyan: #5EEAD4; --cyan-dim: rgba(94,234,212,.18);
    --amber: #F5B942; --amber-dim: rgba(245,185,66,.18);
    --crimson: #E23B5D; --violet: #B389FF; --violet-dim: rgba(179,137,255,.16);
    --ink: #EDE9FF; --ink-dim: #948CC4; --line: rgba(148,140,196,.22);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse at 20% -10%, rgba(94,234,212,.10), transparent 45%),
      radial-gradient(ellipse at 90% 10%, rgba(245,185,66,.08), transparent 40%),
      linear-gradient(180deg, var(--void) 0%, #0E0B24 60%, var(--void) 100%);
    color: var(--ink); font-family:'Noto Sans TC', sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding: 0 0 40px; position:relative; overflow-x:hidden;
  }
  .title-font{ font-family:'Cinzel', serif; } .tech-font{ font-family:'Rajdhani', sans-serif; letter-spacing:.03em; }
  .dust{ position:fixed; inset:0; pointer-events:none; z-index:0; }
  .mote{ position:absolute; bottom:-6%; border-radius:50%; background: radial-gradient(circle, rgba(94,234,212,.9), transparent 70%); animation: rise linear infinite; opacity:.6; }
  @keyframes rise{ from{ transform: translateY(0); opacity:0; } 10%{ opacity:.7; } 90%{ opacity:.4; } to{ transform: translateY(-115vh) translateX(20px); opacity:0; } }

  .app{ width:100%; max-width:600px; position:relative; z-index:1; padding: 18px 14px; }
  .screen{ display:none; } .screen.active{ display:block; }

  /* ---- shared header ---- */
  .header-bar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .back-link{ background:none; border:none; color:var(--ink-dim); font-family:'Rajdhani',sans-serif; font-weight:700; font-size:14px; cursor:pointer; }
  .stat-badges{ display:flex; gap:8px; }
  .stat-badge{ font-family:'Rajdhani',sans-serif; font-weight:700; font-size:13px; background: var(--amber-dim); color: var(--amber); border:1px solid rgba(245,185,66,.4); border-radius:10px; padding:5px 10px; }

  .panel{ background: var(--mist); border:1px solid var(--line); border-radius:20px; padding:20px; box-shadow: 0 12px 30px rgba(0,0,0,.3); }
  h1.title-font{ font-size:22px; margin:0 0 6px; }
  p.desc{ color: var(--ink-dim); font-size:14px; line-height:1.7; margin: 0 0 18px; }

  /* ---- tower map (5 stages) ---- */
  .tower-path{ position:relative; padding-left:4px; }
  .tower-path::before{ content:""; position:absolute; left:31px; top:30px; bottom:30px; width:5px; background: repeating-linear-gradient(to bottom, var(--line) 0 8px, transparent 8px 16px); border-radius:5px; }
  .stage-row{ position:relative; display:flex; align-items:center; gap:16px; padding:12px 0; }
  .stage-node{ flex:0 0 auto; width:64px; height:64px; border-radius:18px; display:flex; align-items:center; justify-content:center; font-size:26px; z-index:1; cursor:pointer; background: var(--mist-2); border:2px solid var(--line); transition: transform .15s ease; }
  .stage-node.unlocked{ background: linear-gradient(150deg, var(--cyan-dim), rgba(94,234,212,.05)); border-color: rgba(94,234,212,.5); box-shadow: 0 0 18px rgba(94,234,212,.18); }
  .stage-node.done{ background: linear-gradient(150deg, var(--amber-dim), rgba(245,185,66,.05)); border-color: rgba(245,185,66,.55); box-shadow: 0 0 18px rgba(245,185,66,.2); }
  .stage-node.locked{ cursor:not-allowed; opacity:.55; }
  .stage-node:hover.unlocked, .stage-node:hover.done{ transform: scale(1.06); }
  .stage-info{ flex:1; }
  .stage-name{ font-family:'Cinzel',serif; font-size:16.5px; }
  .stage-sub{ color: var(--ink-dim); font-size:12.5px; margin-top:2px; font-family:'Rajdhani',sans-serif; }
  .stage-grammar{ display:flex; gap:5px; flex-wrap:wrap; margin-top:6px; }
  .grammar-chip{ font-size:11px; background: var(--violet-dim); color: var(--violet); border:1px solid rgba(179,137,255,.35); border-radius:8px; padding:2px 7px; }

  /* ---- level list within a stage ---- */
  .level-card{ background: var(--mist-2); border:1px solid var(--line); border-radius:16px; padding:15px 16px; margin-bottom:10px; display:flex; align-items:center; gap:14px; cursor:pointer; }
  .level-card.locked{ opacity:.5; cursor:not-allowed; }
  .level-card.boss{ border-color: rgba(226,59,93,.45); background: linear-gradient(150deg, rgba(226,59,93,.1), var(--mist-2)); }
  .level-icon{ font-size:28px; flex:0 0 auto; width:46px; height:46px; border-radius:12px; display:flex; align-items:center; justify-content:center; background: rgba(94,234,212,.1); }
  .level-card.boss .level-icon{ background: rgba(226,59,93,.14); }
  .level-body{ flex:1; }
  .level-name{ font-weight:700; font-size:15.5px; }
  .level-meta{ color: var(--ink-dim); font-size:12.5px; margin-top:2px; }
  .level-stars{ font-size:13px; }
  .level-stars span{ opacity:.3; } .level-stars span.lit{ opacity:1; }

  /* ---- vocab learn carousel ---- */
  .learn-card{ background: linear-gradient(150deg, var(--mist-2), var(--mist)); border:1px solid var(--line); border-radius:20px; padding:30px 20px; text-align:center; min-height:190px; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .learn-word{ font-family:'Rajdhani',sans-serif; font-weight:700; font-size:34px; color: var(--ink); }
  .learn-pos{ font-size:12px; color: var(--violet); background: var(--violet-dim); border-radius:8px; padding:3px 10px; margin-top:8px; display:inline-block; }
  .learn-meaning{ font-size:17px; color: var(--amber); margin-top:14px; min-height:26px; }
  .learn-hint{ font-size:12.5px; color: var(--ink-dim); margin-top:6px; }
  .learn-audio{ margin-top:14px; background: rgba(94,234,212,.14); border:1px solid rgba(94,234,212,.4); color: var(--cyan); border-radius:12px; padding:8px 16px; font-family:'Rajdhani',sans-serif; font-weight:700; cursor:pointer; }
  .learn-nav{ display:flex; align-items:center; justify-content:space-between; margin-top:16px; }
  .nav-btn{ background: var(--mist-2); border:1px solid var(--line); color: var(--ink); border-radius:12px; padding:10px 16px; font-family:'Rajdhani',sans-serif; font-weight:700; cursor:pointer; }
  .nav-btn:disabled{ opacity:.35; cursor:not-allowed; }
  .learn-dots{ display:flex; gap:5px; }
  .dot{ width:7px; height:7px; border-radius:50%; background: var(--line); }
  .dot.active{ background: var(--cyan); }
  .start-trial-btn{ margin-top:18px; width:100%; background: linear-gradient(120deg, var(--amber), #e0982b); color:#3a2600; border:none; border-radius:14px; padding:14px; font-family:'Rajdhani',sans-serif; font-weight:700; font-size:15.5px; cursor:pointer; }

  /* ---- battle/trial phase ---- */
  .trial-hud{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .hearts{ font-size:17px; }
  .progress-track{ height:8px; border-radius:8px; background: var(--mist-2); overflow:hidden; margin-bottom:16px; }
  .progress-fill{ height:100%; background: linear-gradient(90deg, var(--cyan), var(--amber)); border-radius:8px; transition: width .3s ease; }
  .puzzle-zh{ color:var(--ink-dim); font-size:13.5px; margin-bottom:8px; }
  .puzzle-sentence{ background: var(--mist-2); border:1px solid var(--line); border-radius:16px; padding:18px 16px; text-align:center; font-size:16.5px; line-height:1.7; font-weight:700; }
  .blank{ display:inline-block; min-width:64px; border-bottom:3px solid var(--amber); color:var(--amber); padding:0 4px; }
  .blank.filled{ color:var(--ink); border-bottom-color: var(--cyan); }
  .options-row{ display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; justify-content:center; }
  .option-card{ flex:1 1 40%; min-width:110px; background: var(--mist-2); border:2px solid var(--line); border-radius:14px; padding:13px 10px; text-align:center; cursor:pointer; transition: border-color .15s ease, transform .12s ease; }
  .option-card:hover:not(.disabled){ border-color: var(--cyan); transform: translateY(-2px); }
  .option-card .word{ font-family:'Rajdhani',sans-serif; font-weight:700; font-size:16px; }
  .option-card .speak-mini{ display:block; margin:6px auto 0; width:26px; height:26px; border-radius:8px; background: rgba(94,234,212,.14); border:1px solid rgba(94,234,212,.35); color:var(--cyan); font-size:12px; cursor:pointer; }
  .option-card.correct{ border-color: var(--amber); background: rgba(245,185,66,.12); }
  .option-card.wrong{ border-color: var(--crimson); background: rgba(226,59,93,.12); }
  .option-card.disabled{ cursor:default; }
  .feedback-box{ background: var(--mist-2); border:1px solid var(--line); border-radius:16px; padding:14px 16px; margin-top:14px; font-size:14.5px; line-height:1.7; display:none; }
  .feedback-box.show{ display:block; }
  .feedback-box.ok{ border-color: rgba(245,185,66,.45); } .feedback-box.no{ border-color: rgba(226,59,93,.45); }
  .fb-verdict{ font-family:'Rajdhani',sans-serif; font-weight:700; font-size:14.5px; margin-bottom:4px; }
  .fb-verdict.ok{ color: var(--amber); } .fb-verdict.no{ color: var(--crimson); }
  .audio-row{ display:flex; gap:8px; justify-content:center; margin-top:10px; }
  .audio-btn{ background: rgba(94,234,212,.12); border:1px solid rgba(94,234,212,.35); color:var(--cyan); border-radius:10px; padding:7px 13px; font-family:'Rajdhani',sans-serif; font-weight:700; font-size:12.5px; cursor:pointer; }
  .audio-btn.slow{ background: rgba(245,185,66,.12); border-color: rgba(245,185,66,.4); color: var(--amber); }
  .continue-btn{ margin-top:14px; width:100%; background: linear-gradient(120deg, var(--cyan), #38c9b4); color:#062824; border:none; border-radius:14px; padding:13px; font-family:'Rajdhani',sans-serif; font-weight:700; font-size:15.5px; cursor:pointer; display:none; }
  .continue-btn.show{ display:block; }

  /* ---- result / reward ---- */
  .result-panel{ text-align:center; }
  .big-stars{ font-size:38px; letter-spacing:8px; margin: 8px 0 10px; }
  .card-grid{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin: 16px 0; }
  .vocab-card{ width:104px; background: var(--mist-2); border:1px solid rgba(245,185,66,.4); border-radius:14px; padding:12px 8px; box-shadow: 0 0 18px rgba(245,185,66,.12); }
  .vocab-card .vc-word{ font-family:'Rajdhani',sans-serif; font-weight:700; color: var(--amber); font-size:14.5px; }
  .vocab-card .vc-meaning{ font-size:12px; color:var(--ink); margin-top:3px; }
  .result-btns{ display:flex; gap:10px; justify-content:center; margin-top:6px; }
  .btn{ border:none; border-radius:14px; padding:12px 18px; font-family:'Rajdhani',sans-serif; font-weight:700; font-size:14.5px; cursor:pointer; }
  .btn-primary{ background: linear-gradient(120deg, var(--amber), #e0982b); color:#3a2600; }
  .btn-ghost{ background: var(--mist-2); color: var(--ink); border:1px solid var(--line); }

  .overlay{ position:fixed; inset:0; background: rgba(6,5,18,.86); display:none; align-items:center; justify-content:center; z-index:20; padding:20px; }
  .overlay.show{ display:flex; }
  .overlay-card{ background: var(--mist); border:1px solid rgba(226,59,93,.4); border-radius:20px; padding:28px 24px; text-align:center; max-width:340px; }
  .overlay-card .oc-title{ font-family:'Cinzel',serif; color: var(--crimson); font-size:18px; margin-bottom:10px; }
  .overlay-card p{ color: var(--ink-dim); font-size:13.5px; line-height:1.7; margin-bottom:16px; }

  @media (max-width:420px){ .learn-word{ font-size:28px; } .puzzle-sentence{ font-size:15px; } }
</style>
</head>
<body>
<div class="dust" id="dust"></div>
<div class="app">

  <!-- TOWER MAP -->
  <div class="screen active" id="towerScreen">
    <div class="header-bar">
      <div class="title-font" style="font-size:19px;">試煉之塔</div>
      <div class="stat-badges"><div class="stat-badge">📖 <span id="towerVocabCount">0</span> 個單字</div></div>
    </div>
    <div class="panel">
      <h1 class="title-font">TOEIC 語詞試煉之塔</h1>
      <p class="desc">五座階層，對應多益從基礎到高階的字彙與 15 大核心文法。每一關先認識新單字，再進入試煉戰鬥。通過魔王關，就能解鎖下一座階層！</p>
      <div class="tower-path" id="towerPath"></div>
    </div>
  </div>

  <!-- STAGE (LEVEL LIST) -->
  <div class="screen" id="stageScreen">
    <div class="header-bar">
      <button class="back-link tech-font" onclick="showTower()">← 返回塔頂地圖</button>
    </div>
    <div class="panel">
      <h1 class="title-font" id="stageTitle"></h1>
      <p class="desc" id="stageDesc"></p>
      <div id="levelList"></div>
    </div>
  </div>

  <!-- LEVEL INTRO -->
  <div class="screen" id="introScreen">
    <div class="header-bar">
      <button class="back-link tech-font" onclick="showStageFromLevel()">← 返回關卡列表</button>
    </div>
    <div class="panel result-panel">
      <div style="font-size:40px;">📜</div>
      <h1 class="title-font" id="introTitle"></h1>
      <p class="desc" id="introGrammarNote" style="text-align:left;"></p>
      <button class="continue-btn show" onclick="startLearnPhase()">進入詞彙修練 ▶</button>
    </div>
  </div>

  <!-- LEARN PHASE -->
  <div class="screen" id="learnScreen">
    <div class="header-bar">
      <button class="back-link tech-font" onclick="showStageFromLevel()">← 返回關卡列表</button>
      <div class="stat-badge tech-font" id="learnCounter">1 / 12</div>
    </div>
    <div class="panel">
      <div class="learn-card">
        <div class="learn-word tech-font" id="learnWord"></div>
        <div class="learn-pos tech-font" id="learnPos"></div>
        <div class="learn-meaning" id="learnMeaning">點擊卡片查看意思</div>
        <div class="learn-hint" id="learnHint">👆 點擊卡片翻面</div>
        <button class="learn-audio tech-font" id="learnAudioBtn" type="button">🔊 聽發音</button>
      </div>
      <div class="learn-nav">
        <button class="nav-btn tech-font" id="learnPrevBtn">← 上一個</button>
        <div class="learn-dots" id="learnDots"></div>
        <button class="nav-btn tech-font" id="learnNextBtn">下一個 →</button>
      </div>
      <button class="start-trial-btn tech-font" id="startTrialBtn" style="display:none;">⚔️ 開始試煉戰鬥</button>
    </div>
  </div>

  <!-- BATTLE / TRIAL PHASE -->
  <div class="screen" id="battleScreen">
    <div class="header-bar">
      <button class="back-link tech-font" onclick="showStageFromLevel()">← 返回關卡列表</button>
      <div class="hearts" id="heartsDisplay"></div>
    </div>
    <div class="panel">
      <div class="progress-track"><div class="progress-fill" id="battleProgress"></div></div>
      <div class="puzzle-zh" id="battleZh"></div>
      <div class="puzzle-sentence" id="battleSentence"></div>
      <div class="options-row" id="battleOptions"></div>
      <div class="feedback-box" id="battleFeedback">
        <div class="fb-verdict" id="battleFbVerdict"></div>
        <div id="battleFbBody"></div>
        <div class="audio-row">
          <button class="audio-btn tech-font" id="battleHearBtn" type="button">🔊 聽完整句</button>
          <button class="audio-btn slow tech-font" id="battleSlowBtn" type="button">🐢 慢速</button>
        </div>
      </div>
      <button class="continue-btn" id="battleNextBtn">下一題 ▶</button>
    </div>
  </div>

  <!-- RESULT -->
  <div class="screen" id="resultScreen">
    <div class="panel result-panel">
      <div style="font-size:36px;" id="resultEmoji">🏆</div>
      <h1 class="title-font" id="resultTitle"></h1>
      <div class="big-stars" id="resultStars"></div>
      <div class="desc" id="resultLine"></div>
      <div class="card-grid" id="resultCardGrid"></div>
      <div class="result-btns">
        <button class="btn btn-ghost tech-font" id="retryLevelBtn">重玩這關</button>
        <button class="btn btn-primary tech-font" id="resultContinueBtn">繼續 ▶</button>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="failOverlay">
  <div class="overlay-card">
    <div class="oc-title title-font">試煉失敗……</div>
    <p>愛心用完了，語意連結中斷。重新集中精神，再挑戰一次這關吧！</p>
    <button class="btn btn-primary tech-font" id="failRetryBtn">重新挑戰</button>
  </div>
</div>

<script>
/* ---------------- DUST ---------------- */
(function(){
  const dust = document.getElementById('dust');
  for(let i=0;i<14;i++){
    const m = document.createElement('div');
    m.className='mote';
    const size = 2+Math.random()*3;
    m.style.width=size+'px'; m.style.height=size+'px';
    m.style.left = Math.random()*100+'%';
    m.style.animationDuration = (10+Math.random()*14)+'s';
    m.style.animationDelay = (Math.random()*10)+'s';
    dust.appendChild(m);
  }
})();

/* ---------------- SPEECH ---------------- */
function speak(text, rate){
  try{
    if(!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    setTimeout(() => {
      const u = new SpeechSynthesisUtterance(text);
      u.lang='en-US'; u.rate = rate || 0.72; u.pitch = 0.98;
      speechSynthesis.speak(u);
    }, 70);
  }catch(e){}
}
function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

/* ---------------- CURRICULUM DATA ---------------- */
const stages = [
  {
    id:1, name:'新手村', sub:'Novice Village · TOEIC 250–400', icon:'🌱', unlocked:true,
    grammarTags:['詞性基礎','Be動詞句型','現在簡單式'],
    desc:'從最基礎的辦公室單字開始，學會用 Be動詞介紹人事物，並掌握現在簡單式的動詞變化。',
    levels:[
      {
        id:'1-1', name:'商務初體驗', icon:'🏢', grammarPoint:'Be動詞與基礎句型 (S + be + C)',
        grammarNote:'介紹人事物、描述狀態時，主詞要搭配對應的 Be動詞：I am、You/We/They are、He/She/It is。例如：This is my manager.',
        words:[
          {en:'office', pos:'n.', zh:'辦公室'}, {en:'manager', pos:'n.', zh:'經理'}, {en:'employee', pos:'n.', zh:'員工'},
          {en:'meeting', pos:'n.', zh:'會議'}, {en:'schedule', pos:'n.', zh:'行程表'}, {en:'colleague', pos:'n.', zh:'同事'},
          {en:'deadline', pos:'n.', zh:'截止日期'}, {en:'report', pos:'n.', zh:'報告'}, {en:'company', pos:'n.', zh:'公司'},
          {en:'email', pos:'n.', zh:'電子郵件'}, {en:'phone', pos:'n.', zh:'電話'}, {en:'computer', pos:'n.', zh:'電腦'}
        ],
        quiz:[
          { template:['The office',' very busy today.'], word:'', fullSentence:'The office is very busy today.', zh:'選出正確的 Be動詞', options:[['is',true],['are',false],['am',false],['be',false]], exp:'主詞 The office 是單數，要搭配 is。' },
          { template:['My colleagues ',' in the meeting room now.'], word:'', fullSentence:'My colleagues are in the meeting room now.', zh:'選出正確的 Be動詞', options:[['are',true],['is',false],['am',false],['be',false]], exp:'主詞 My colleagues 是複數，要搭配 are。' },
          { template:['This ',' an important email from the manager.'], word:'', fullSentence:'This is an important email from the manager.', zh:'選出正確的 Be動詞', options:[['is',true],['are',false],['am',false],['be',false]], exp:'This 是單數指示代名詞，搭配 is。' },
          { template:['I ',' an employee at this company.'], word:'', fullSentence:'I am an employee at this company.', zh:'選出正確的 Be動詞', options:[['am',true],['is',false],['are',false],['be',false]], exp:'主詞 I 固定搭配 am。' },
          { template:['The deadline for the report ',' tomorrow.'], word:'', fullSentence:'The deadline for the report is tomorrow.', zh:'選出正確的 Be動詞', options:[['is',true],['are',false],['am',false],['be',false]], exp:'The deadline 是單數主詞，搭配 is。' },
          { template:['These computers ',' very old.'], word:'', fullSentence:'These computers are very old.', zh:'選出正確的 Be動詞', options:[['are',true],['is',false],['am',false],['be',false]], exp:'These computers 是複數主詞，搭配 are。' }
        ]
      },
      {
        id:'1-2', name:'日常對話', icon:'💬', grammarPoint:'現在簡單式 (Present Simple)',
        grammarNote:'描述習慣性動作或固定事實時用現在簡單式。第三人稱單數（he/she/it）動詞要加 -s 或 -es，例如：She answers emails every morning.',
        words:[

          { template:['This is an ',' opportunity for our team.'], fullSentence:'This is an exciting opportunity for our team.', zh:'這裡需要哪種分詞形式？', options:[['exciting',true],['excited',false],['excite',false],['excites',false]], exp:'opportunity（機會）本身「令人興奮」，用現在分詞 exciting。' },
          { template:['I was ',' by the confusing instructions.'], fullSentence:'I was confused by the confusing instructions.', zh:'這裡需要哪種分詞形式？', options:[['confused',true],['confusing',false],['confuse',false],['confuses',false]], exp:'「我」是感到困惑的一方，用過去分詞 confused。' },
          { template:['After the trip, everyone felt ','.'], fullSentence:'After the trip, everyone felt exhausted.', zh:'這裡需要哪種分詞形式？', options:[['exhausted',true],['exhausting',false],['exhaust',false],['exhausts',false]], exp:'大家是「感到筋疲力盡」的一方，用過去分詞 exhausted。' },
          { template:['',' is important for career growth.'], fullSentence:'Training is important for career growth.', zh:'這裡需要哪種詞性當主詞？', options:[['Training',true],['Trained',false],['Trains',false],['To train',false]], exp:'動名詞（V-ing）可以當主詞，像名詞一樣使用：Training is important。' },
          { template:['We finished ',' the report before the deadline.'], fullSentence:'We finished preparing the report before the deadline.', zh:'finish 後面要接哪種形式？', options:[['preparing',true],['prepare',false],['prepared',false],['prepares',false]], exp:'finish 後面要接動名詞（V-ing）：finished preparing。' },
          { template:['You should avoid ',' the report late.'], fullSentence:'You should avoid submitting the report late.', zh:'avoid 後面要接哪種形式？', options:[['submitting',true],['submit',false],['submitted',false],['submits',false]], exp:'avoid 後面要接動名詞（V-ing）：avoid submitting。' }
        ]
      }
    ]
  },
  { id:4, name:'遺跡深淵', sub:'Ruins of the Abyss · TOEIC 700–850', icon:'🗿', unlocked:false, grammarTags:['比較級／最高級','關係子句','連接詞與子句'], desc:'即將推出：進階句構與子句。', levels:[] },
  { id:5, name:'魔王之塔', sub:'The Final Tower · TOEIC 850–990', icon:'👑', unlocked:false, grammarTags:['條件句','假設語氣','倒裝與強調句'], desc:'即將推出：多益最高階文法，最終魔王戰。', levels:[] }
];

/* ---------------- STATE ---------------- */
let currentStageIdx = 0;
let currentLevel = null;
let learnIdx = 0;
let learnFlipped = false;
let activeQuiz = [];
let quizIdx = 0;
let hearts = 3;
let correctCount = 0;
let answered = false;
let currentOptions = [];
let currentCorrectIndex = -1;
let totalVocabLearned = new Set();
let stageProgress = {}; // stageId -> array of level completion {stars}
stages.forEach(s => stageProgress[s.id] = {});

function updateTowerVocabCount(){ document.getElementById('towerVocabCount').textContent = totalVocabLearned.size; }

/* ---------------- SCREEN NAV ---------------- */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function showTower(){ renderTower(); showScreen('towerScreen'); }
function showStageFromLevel(){ renderStage(currentStageIdx); showScreen('stageScreen'); }

/* ---------------- TOWER RENDER ---------------- */
function renderTower(){
  updateTowerVocabCount();
  const wrap = document.getElementById('towerPath');
  wrap.innerHTML = '';
  stages.forEach((s, i) => {
    const doneCount = Object.values(stageProgress[s.id]).length;
    const state = !s.unlocked ? 'locked' : (doneCount >= s.levels.length && s.levels.length>0 ? 'done' : 'unlocked');
    const row = document.createElement('div');
    row.className = 'stage-row';
    row.innerHTML = `
      <div class="stage-node ${state}" onclick="${s.unlocked ? `enterStage(${i})` : ''}">${state==='locked' ? '🔒' : s.icon}</div>
      <div class="stage-info">
        <div class="stage-name">${s.name}</div>
        <div class="stage-sub">${s.sub}</div>
        <div class="stage-grammar">${s.grammarTags.map(g=>`<span class="grammar-chip">${g}</span>`).join('')}</div>
      </div>`;
    wrap.appendChild(row);
  });
}

function enterStage(i){
  currentStageIdx = i;
  renderStage(i);
  showScreen('stageScreen');
}

function renderStage(i){
  const s = stages[i];
  document.getElementById('stageTitle').textContent = s.icon + '  ' + s.name;
  document.getElementById('stageDesc').textContent = s.desc;
  const list = document.getElementById('levelList');
  list.innerHTML = '';
  if(s.levels.length === 0){
    list.innerHTML = `<p class="desc">此階層的關卡正在鍛造中，敬請期待後續更新！</p>`;
    return;
  }
  s.levels.forEach((lvl, idx) => {
    const prog = stageProgress[s.id][lvl.id];
    const locked = idx > 0 && !stageProgress[s.id][s.levels[idx-1].id];
    const card = document.createElement('div');
    card.className = 'level-card' + (lvl.boss ? ' boss' : '') + (locked ? ' locked' : '');
    const starsHtml = [1,2,3].map(n => `<span class="${prog && n<=prog.stars ? 'lit':''}">★</span>`).join('');
    card.innerHTML = `
      <div class="level-icon">${locked ? '🔒' : lvl.icon}</div>
      <div class="level-body">
        <div class="level-name">${lvl.name}${lvl.boss ? '　👑' : ''}</div>
        <div class="level-meta">${lvl.grammarPoint} · ${lvl.words.length} 個單字</div>
        <div class="level-stars">${starsHtml}</div>
      </div>`;
    if(!locked) card.onclick = () => enterLevel(s, lvl);
    list.appendChild(card);
  });
}

/* ---------------- LEVEL INTRO ---------------- */
function enterLevel(stage, level){
  currentLevel = { stage, level };
  document.getElementById('introTitle').textContent = level.icon + ' ' + level.name;
  document.getElementById('introGrammarNote').innerHTML = `<strong style="color:var(--cyan);">📐 文法重點：${level.grammarPoint}</strong><br><br>${level.grammarNote}<br><br>本關將學習 ${level.words.length} 個新單字，接著進入試煉戰鬥。`;
  showScreen('introScreen');
}

/* ---------------- LEARN PHASE ---------------- */
function startLearnPhase(){
  learnIdx = 0; learnFlipped = false;
  renderLearnCard();
  showScreen('learnScreen');
}

function renderLearnCard(){
  const words = currentLevel.level.words;
  const w = words[learnIdx];
  document.getElementById('learnCounter').textContent = (learnIdx+1) + ' / ' + words.length;
  document.getElementById('learnWord').textContent = w.en;
  document.getElementById('learnPos').textContent = w.pos;
  learnFlipped = false;
  document.getElementById('learnMeaning').textContent = '點擊卡片查看意思';
  document.getElementById('learnHint').style.display = 'block';

  document.getElementById('learnPrevBtn').disabled = learnIdx === 0;
  document.getElementById('learnNextBtn').textContent = learnIdx === words.length-1 ? '完成 ✓' : '下一個 →';

  const dots = document.getElementById('learnDots');
  dots.innerHTML = '';
  words.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i===learnIdx ? ' active' : '');
    dots.appendChild(d);
  });

  document.getElementById('startTrialBtn').style.display = learnIdx === words.length-1 ? 'block' : 'none';
  document.getElementById('learnAudioBtn').onclick = () => speak(w.en, 0.7);
  setTimeout(() => speak(w.en, 0.7), 250);
}

document.querySelector('.learn-card').addEventListener('click', function(e){
  if(e.target.closest('.learn-audio')) return;
  const words = currentLevel.level.words;
  const w = words[learnIdx];
  learnFlipped = !learnFlipped;
  document.getElementById('learnMeaning').textContent = learnFlipped ? w.zh : '點擊卡片查看意思';
  document.getElementById('learnHint').style.display = learnFlipped ? 'none' : 'block';
});

document.getElementById('learnPrevBtn').onclick = () => { if(learnIdx>0){ learnIdx--; renderLearnCard(); } };
document.getElementById('learnNextBtn').onclick = () => {
  const words = currentLevel.level.words;
  if(learnIdx < words.length-1){ learnIdx++; renderLearnCard(); }
};
document.getElementById('startTrialBtn').onclick = () => startBattlePhase();

/* ---------------- BATTLE / TRIAL PHASE ---------------- */
function startBattlePhase(){
  activeQuiz = shuffleArray(currentLevel.level.quiz);
  quizIdx = 0;
  hearts = currentLevel.level.boss ? 2 : 3;
  correctCount = 0;
  document.getElementById('failOverlay').classList.remove('show');
  renderBattleQuestion();
  showScreen('battleScreen');
}

function renderHearts(){
  const el = document.getElementById('heartsDisplay');
  el.innerHTML = '';
  const max = currentLevel.level.boss ? 2 : 3;
  for(let i=0;i<max;i++) el.innerHTML += i < hearts ? '❤️' : '🖤';
}

function renderBattleQuestion(){
  answered = false;
  const q = activeQuiz[quizIdx];
  renderHearts();
  document.getElementById('battleProgress').style.width = (quizIdx/activeQuiz.length)*100 + '%';
  document.getElementById('battleFeedback').classList.remove('show','ok','no');
  document.getElementById('battleNextBtn').classList.remove('show');
  document.getElementById('battleZh').textContent = q.zh;

  const sEl = document.getElementById('battleSentence');
  sEl.innerHTML = `${q.template[0]}<span class="blank" id="battleBlank">____</span>${q.template[1]}`;

  const tagged = q.options.map(([word,isCorrect]) => ({word, isCorrect}));
  const shuffled = shuffleArray(tagged);
  currentOptions = shuffled;
  currentCorrectIndex = shuffled.findIndex(o=>o.isCorrect);

  const row = document.getElementById('battleOptions');
  row.innerHTML = '';
  shuffled.forEach((opt, i) => {
    const card = document.createElement('div');
    card.className = 'option-card';
    card.innerHTML = `<div class="word tech-font">${opt.word}</div><button type="button" class="speak-mini">🔊</button>`;
    card.querySelector('.speak-mini').onclick = (e) => { e.stopPropagation(); speak(opt.word, 0.7); };
    card.onclick = () => selectBattleOption(i, card, q);
    row.appendChild(card);
  });
}

function selectBattleOption(i, cardEl, q){
  if(answered) return;
  answered = true;
  document.querySelectorAll('#battleOptions .option-card').forEach(c => c.classList.add('disabled'));
  cardEl.classList.add(i===currentCorrectIndex ? 'correct' : 'wrong');

  const blank = document.getElementById('battleBlank');
  blank.textContent = currentOptions[i].word;
  blank.classList.add('filled');

  const fb = document.getElementById('battleFeedback');
  const verdict = document.getElementById('battleFbVerdict');
  const body = document.getElementById('battleFbBody');
  fb.classList.add('show');

  if(i === currentCorrectIndex){
    correctCount++;
    fb.classList.add('ok');
    verdict.className = 'fb-verdict ok';
    verdict.textContent = '⚡ 正確！';
  } else {
    hearts--;
    fb.classList.add('no');
    verdict.className = 'fb-verdict no';
    verdict.textContent = '✕ 語意衝突！';
    renderHearts();
  }
  body.textContent = q.exp;
  document.getElementById('battleHearBtn').onclick = () => speak(q.fullSentence, 0.72);
  document.getElementById('battleSlowBtn').onclick = () => speak(q.fullSentence, 0.5);
  setTimeout(() => speak(q.fullSentence, 0.72), 300);

  if(hearts <= 0){
    setTimeout(() => document.getElementById('failOverlay').classList.add('show'), 700);
    return;
  }
  document.getElementById('battleNextBtn').classList.add('show');
}

document.getElementById('battleNextBtn').onclick = () => {
  if(quizIdx < activeQuiz.length-1){ quizIdx++; renderBattleQuestion(); }
  else finishBattle();
};
document.getElementById('failRetryBtn').onclick = () => { document.getElementById('failOverlay').classList.remove('show'); startBattlePhase(); };

function finishBattle(){
  const total = activeQuiz.length;
  let stars = 1;
  if(correctCount === total) stars = 3;
  else if(correctCount >= Math.ceil(total*0.6)) stars = 2;

  const stage = currentLevel.stage, level = currentLevel.level;
  const prev = stageProgress[stage.id][level.id];
  if(!prev || stars > prev.stars) stageProgress[stage.id][level.id] = { stars };

  level.words.forEach(w => totalVocabLearned.add(w.en));

  document.getElementById('resultEmoji').textContent = level.boss ? '👑' : '🏆';
  document.getElementById('resultTitle').textContent = level.name + (stars>0 ? ' 通關！' : '');
  document.getElementById('resultStars').textContent = Array.from({length:3},(_,i)=> i<stars?'★':'☆').join('');
  document.getElementById('resultLine').textContent = `答對 ${correctCount} / ${total} 題，學會 ${level.words.length} 個新單字`;

  const grid = document.getElementById('resultCardGrid');
  grid.innerHTML = '';
  level.words.forEach(w => {
    const c = document.createElement('div');
    c.className = 'vocab-card';
    c.innerHTML = `<div class="vc-word tech-font">${w.en}</div><div class="vc-meaning">${w.zh}</div>`;
    grid.appendChild(c);
  });

  // unlock next stage if boss cleared
  const idx = stages.findIndex(s => s.id === stage.id);
  if(level.boss && idx < stages.length-1){
    stages[idx+1].unlocked = true;
  }

  document.getElementById('retryLevelBtn').onclick = () => startBattlePhase();
  document.getElementById('resultContinueBtn').onclick = () => { renderStage(currentStageIdx); showScreen('stageScreen'); };

  showScreen('resultScreen');
}

/* ---------------- INIT ---------------- */
renderTower();
</script>
</body>
